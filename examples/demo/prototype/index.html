<!doctype html>
<html lang="en"><meta charset="utf-8"><title>ProtoFlow prototype</title>
<style>body{margin:0;background:#f4f6fb;color:#18253d;font:16px Arial,sans-serif}main{max-width:640px;margin:64px auto;background:white;padding:32px;border-radius:16px}h1{margin:0 0 12px;font-size:32px}p{line-height:24px}.meta{height:24px;color:#667085}label{display:block;margin-top:24px}input{box-sizing:border-box;width:100%;padding:12px;margin:8px 0 16px;font:inherit;border:1px solid #667085;border-radius:8px}button{background:#325be7;color:white;border:0;border-radius:8px;padding:12px 20px;font:inherit;cursor:pointer}#confirmation{background:#edf2ff;padding:16px;border-radius:8px;margin-top:16px}body[data-mismatch] main{max-width:560px}</style>
<main id="card"><h1 id="heading">Create a design session</h1><p>Keep the prototype and application in step.</p><div id="clock" class="meta">Prototype clock: 09:00</div><label for="name">Session name</label><input id="name" placeholder="Example: settings screen"><button id="create">Create session</button><p id="confirmation" hidden aria-live="polite"></p></main>
<script>const params=new URLSearchParams(location.search);if(params.has('mismatch'))document.body.dataset.mismatch='true';document.querySelector('#create').addEventListener('click',()=>{const message=document.querySelector('#confirmation');message.textContent='Session created: '+document.querySelector('#name').value;message.hidden=false;});if(!params.has('clock'))document.querySelector('#clock').textContent='Ready for review';</script></html>
